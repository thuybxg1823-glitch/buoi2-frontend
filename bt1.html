<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Workshop HTML</title>
</head>
<body>
    <header>
        <h1>Workshop HTML</h1>
        <nav>
            <a href="#gioi-thieu">Giới thiệu</a>
            <a href="#dang-ky">Đăng ký</a>
            <a href="#lien-he">Liên hệ</a>
        </nav>
    </header>
    <main>
        <section id="gioi-thieu">
            <h2>Học HTML qua dự án</h2>
            <p>
                Tham gia workshop để tìm hiểu cách xây dựng cấu trúc
                một trang web bằng HTML.
            </p>
            <figure>
                <img src="/html/anhminhhoa.jpg" width="500" height="350" alt="Hình minh họa workshop HTML">
                <figcaption>
                    Workshop thực hành thiết kế cấu trúc trang web.
                </figcaption>
            </figure>
        </section>
        <section id="dang-ky">
            <h2>Đăng ký tham gia</h2>
            <form>
                <label for="ten">Họ và tên:</label>
                <input type="text" id="ten" name="ten">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br>
                <button type="submit">Đăng ký</button>
            </form>
        </section>
    </main>
    <footer id="lien-he">
        <p>Email: workshop@gmail.com</p>
        <p>&copy; 2026 Workshop HTML</p>
    </footer>
</body>
</html>
